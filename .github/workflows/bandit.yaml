name: Bandit

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions: {}

jobs:
  bandit:
    permissions:
      contents: read
    uses: senzing-factory/build-resources/.github/workflows/bandit.yaml@v4
    with:
      config-file: pyproject.toml
      targets: >-
        sz_tools
        sz_tools/sz_audit
        sz_tools/sz_command
        sz_tools/sz_configtool
        sz_tools/sz_create_project
        sz_tools/sz_explorer
        sz_tools/sz_export
        sz_tools/sz_file_loader
        sz_tools/sz_json_analyzer
        sz_tools/sz_setup_config
        sz_tools/sz_snapshot
        sz_tools/sz_update_project
