name: Bandit

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions: {}

jobs:
  bandit:
    permissions:
      security-events: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
    timeout-minutes: 10

    steps:
      - name: Run Bandit Scan
        uses: PyCQA/bandit-action@v1
        with:
          python-version: ${{ matrix.python-version }}
          targets: >-
            sz_tools
            sz_tools/sz_audit
            sz_tools/sz_command
            sz_tools/sz_configtool
            sz_tools/sz_create_project
            sz_tools/sz_explorer
            sz_tools/sz_export
            sz_tools/sz_file_loader
            sz_tools/sz_json_analyzer
            sz_tools/sz_setup_config
            sz_tools/sz_snapshot
            sz_tools/sz_update_project
